name: Auto Deploy to EC2

on:
  push:
    branches: [ main ]

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Validate deploy contract files
        run: |
          test -f docker-compose.prod.yml
          test -f nginx/nginx.conf
          echo "✓ Required deployment files found"

      - name: Validate production JWT signing configuration
        env:
          JWT_ALGORITHM: ${{ secrets.PROD_JWT_ALGORITHM }}
          JWT_PRIVATE_KEY: ${{ secrets.PROD_JWT_PRIVATE_KEY }}
          JWT_PUBLIC_KEY: ${{ secrets.PROD_JWT_PUBLIC_KEY }}
          JWT_KEY_ID: ${{ secrets.PROD_JWT_KEY_ID }}
        run: |
          if [ "$JWT_ALGORITHM" != "RS256" ]; then
            echo "PROD_JWT_ALGORITHM must be RS256."
            exit 1
          fi

          missing=0
          for key in JWT_PRIVATE_KEY JWT_PUBLIC_KEY JWT_KEY_ID; do
            if [ -z "${!key}" ]; then
              echo "Missing required GitHub Actions secret: PROD_${key}"
              missing=1
            fi
          done

          for key in JWT_PRIVATE_KEY JWT_PUBLIC_KEY; do
            if [[ "${!key}" == *$'\n'* ]]; then
              echo "PROD_${key} must be a single line with literal \\n escapes."
              missing=1
            fi
          done
          exit "$missing"

      - name: AWS Login
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      # --- GHCR LOGIN ---
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --- AUTOMATIC S3 BUCKET CREATION ---
      - name: Bootstrap S3 Bucket
        run: |
          BUCKET_NAME="autopilot-monster-state-${{ github.repository_owner }}"
          if ! aws s3api head-bucket --bucket "$BUCKET_NAME" 2>/dev/null; then
            echo "Bucket does not exist. Creating..."
            aws s3api create-bucket --bucket "$BUCKET_NAME" --region ap-south-1 --create-bucket-configuration LocationConstraint=ap-south-1
            aws s3api put-bucket-versioning --bucket "$BUCKET_NAME" --versioning-configuration Status=Enabled
          else
            echo "Bucket already exists."
          fi
          echo "BUCKET_NAME=$BUCKET_NAME" >> $GITHUB_ENV

      # --- TERRAFORM INIT WITH DYNAMIC BACKEND ---
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"
          terraform_wrapper: false

      - name: Terraform Init & Apply
        run: |
          export TF_IN_AUTOMATION=true
          terraform init \
            -backend-config="bucket=${{ env.BUCKET_NAME }}" \
            -backend-config="key=terraform.tfstate" \
            -backend-config="region=ap-south-1"
          terraform fmt -check -recursive
          terraform validate
          set +e
          terraform plan -out=tfplan -detailed-exitcode
          TF_PLAN_EXIT=$?
          set -e
          if [ "$TF_PLAN_EXIT" -eq 1 ]; then
            echo "Terraform plan failed"
            exit 1
          fi
          if [ "$TF_PLAN_EXIT" -eq 2 ]; then
            terraform apply -auto-approve tfplan
          else
            echo "No Terraform changes detected; skipping apply"
          fi
          echo "INSTANCE_ID=$(terraform output -raw instance_id)" >> $GITHUB_ENV
          echo "ELASTIC_IP=$(terraform output -raw elastic_ip)" >> $GITHUB_ENV

      # --- BUILD & PUSH DOCKER IMAGES (API + UI) ---
      - name: Build and Push API Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ghcr.io/${{ github.repository }}/api:latest

      # --- CREATE .ENV FROM GITHUB SECRETS ---
      - name: Generate backend .env.production from GitHub Secrets
        run: |
          cat > backend/.env.production << 'EOF'
          # Production Environment — Generated from GitHub Secrets
          
          # Application
          APP_PORT=${{ secrets.PROD_APP_PORT }}
          APP_HOST=${{ secrets.PROD_APP_HOST }}
          APP_URL=${{ secrets.PROD_APP_URL }}
          NODE_ENV=production
          APP_SECRET=${{ secrets.PROD_APP_SECRET }}
          LOG_LEVEL=${{ secrets.PROD_LOG_LEVEL }}
          LOG_FORMAT=${{ secrets.PROD_LOG_FORMAT }}
          
          # Database
          DATABASE_URL=${{ secrets.PROD_DATABASE_URL }}
          DB_SYNCHRONIZE=false
          DB_SSL=true
          DB_LOGGING=false
          DB_POOL_SIZE=20
          
          # Cache / Queue (Redis)
          REDIS_HOST=redis
          REDIS_PORT=6379
          REDIS_PASSWORD=${{ secrets.PROD_REDIS_PASSWORD }}
          REDIS_DB=0
          REDIS_TLS=false
          REDIS_TTL=3600
          
          # Storage (S3)
          MINIO_ENDPOINT=${{ secrets.PROD_MINIO_ENDPOINT }}
          MINIO_PORT=${{ secrets.PROD_MINIO_PORT }}
          MINIO_ACCESS_KEY=${{ secrets.PROD_MINIO_ACCESS_KEY }}
          MINIO_SECRET_KEY=${{ secrets.PROD_MINIO_SECRET_KEY }}
          
          # Vector Database
          QDRANT_URL=${{ secrets.PROD_QDRANT_URL }}
          
          # Authentication (RS256)
          JWT_ALGORITHM=${{ secrets.PROD_JWT_ALGORITHM }}
          JWT_PRIVATE_KEY=${{ secrets.PROD_JWT_PRIVATE_KEY }}
          JWT_PUBLIC_KEY=${{ secrets.PROD_JWT_PUBLIC_KEY }}
          JWT_KEY_ID=${{ secrets.PROD_JWT_KEY_ID }}
          JWT_EXPIRES_IN=15m
          JWT_REFRESH_SECRET=${{ secrets.PROD_JWT_REFRESH_SECRET }}
          JWT_REFRESH_EXPIRES_IN=7d
          
          # AI Services
          OPENAI_API_KEY=${{ secrets.PROD_OPENAI_API_KEY }}
          FRONTEND_URL=https://autopilots.monster
          
          # Stripe
          STRIPE_SECRET_KEY=${{ secrets.PROD_STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET=${{ secrets.PROD_STRIPE_WEBHOOK_SECRET }}
          STRIPE_PRICE_STARTER_MONTHLY=${{ secrets.PROD_STRIPE_PRICE_STARTER_MONTHLY }}
          STRIPE_PRICE_STARTER_ANNUAL=${{ secrets.PROD_STRIPE_PRICE_STARTER_ANNUAL }}
          STRIPE_PRICE_PRO_MONTHLY=${{ secrets.PROD_STRIPE_PRICE_PRO_MONTHLY }}
          STRIPE_PRICE_PRO_ANNUAL=${{ secrets.PROD_STRIPE_PRICE_PRO_ANNUAL }}
          STRIPE_PRICE_ENTERPRISE_MONTHLY=${{ secrets.PROD_STRIPE_PRICE_ENTERPRISE_MONTHLY }}
          STRIPE_PRICE_ENTERPRISE_ANNUAL=${{ secrets.PROD_STRIPE_PRICE_ENTERPRISE_ANNUAL }}
          
          # Rate Limiting
          THROTTLE_TTL=60
          THROTTLE_LIMIT=100
          
          # OAuth
          GOOGLE_CLIENT_ID=${{ secrets.PROD_GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET=${{ secrets.PROD_GOOGLE_CLIENT_SECRET }}
          GOOGLE_CALLBACK_URL=https://api.autopilots.monster/api/v1/auth/google/callback
          FACEBOOK_APP_ID=${{ secrets.PROD_FACEBOOK_APP_ID }}
          FACEBOOK_APP_SECRET=${{ secrets.PROD_FACEBOOK_APP_SECRET }}
          FACEBOOK_CALLBACK_URL=https://api.autopilots.monster/api/v1/auth/facebook/callback
          GITHUB_CLIENT_ID=${{ secrets.PROD_GITHUB_CLIENT_ID }}
          GITHUB_CLIENT_SECRET=${{ secrets.PROD_GITHUB_CLIENT_SECRET }}
          GITHUB_CALLBACK_URL=https://api.autopilots.monster/api/v1/auth/github/callback
          EOF
          echo "✓ .env.production generated from GitHub Secrets"

      # --- UPLOAD CONFIG FILES TO S3 ---
      - name: Sync Config to S3
        run: |
          aws s3 cp docker-compose.prod.yml s3://${{ env.BUCKET_NAME }}/deploy/docker-compose.prod.yml
          aws s3 cp nginx/nginx.conf s3://${{ env.BUCKET_NAME }}/deploy/nginx/nginx.conf
          aws s3 cp backend/.env.production s3://${{ env.BUCKET_NAME }}/deploy/backend/.env.production
          echo "✓ Config files synced to S3"

      # --- DEPLOY VIA SSM ---
      - name: Deploy via SSM
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ env.INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[
              \"sudo mkdir -p /home/ubuntu/app/nginx/ssl /home/ubuntu/app/backend /home/ubuntu/app/certbot/conf /home/ubuntu/app/certbot/www\",
              \"sudo chown -R ubuntu:ubuntu /home/ubuntu/app\",
              \"aws s3 cp s3://${{ env.BUCKET_NAME }}/deploy/docker-compose.prod.yml /home/ubuntu/app/docker-compose.prod.yml\",
              \"aws s3 cp s3://${{ env.BUCKET_NAME }}/deploy/nginx/nginx.conf /home/ubuntu/app/nginx/nginx.conf\",
              \"aws s3 cp s3://${{ env.BUCKET_NAME }}/deploy/backend/.env.production /home/ubuntu/app/backend/.env.production\",
              \"cd /home/ubuntu/app\",
              \"printf 'GITHUB_REPOSITORY=%s\\nDOMAIN=%s\\nNEXT_PUBLIC_API_URL=%s\\n' '${REPO_LOWER}' 'api.autopilots.monster' 'https://api.autopilots.monster/api/v1' > .env\",
              \"sudo docker login ghcr.io -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }}\",
              \"sudo docker compose -f docker-compose.prod.yml pull\",
              \"sudo docker compose -f docker-compose.prod.yml run --rm api npm run migrate:prod\",
              \"sudo docker compose -f docker-compose.prod.yml up -d --remove-orphans --force-recreate\",
              \"echo 'Deployment complete. Services running:'\",
              \"sudo docker compose -f docker-compose.prod.yml ps\",
              \"sudo docker compose -f docker-compose.prod.yml logs --tail=100 api qdrant nginx || true\"
            ]" \
            --region ap-south-1 \
            --query 'Command.CommandId' \
            --output text)
          echo "SSM_COMMAND_ID=$COMMAND_ID" >> $GITHUB_ENV

      - name: Wait for instance to be ready (Approach 1 - EC2 status check)
        run: |
          echo "Waiting for EC2 instance to be in running state..."
          aws ec2 wait instance-running \
            --instance-ids "${{ env.INSTANCE_ID }}" \
            --region ap-south-1
          echo "✓ EC2 instance is running"

      - name: Wait for SSM agent to be ready (Approach 2 - Simple SSM health check)
        run: |
          echo "Polling for SSM agent readiness (up to 50 seconds)..."
          for i in $(seq 1 5); do
            echo "Attempt $i/5: Checking SSM agent status..."
            if aws ssm describe-instance-information \
              --filters "Key=InstanceIds,Values=${{ env.INSTANCE_ID }}" \
              --region ap-south-1 \
              --query 'InstanceInformationList[0].PingStatus' \
              --output text | grep -q "Online"; then
              echo "✓ SSM agent is online"
              break
            fi
            if [ "$i" -lt 5 ]; then
              sleep 10
            fi
          done

      - name: Poll SSM command status (Approach 3 - Manual polling with timeout)
        run: |
          echo "Polling for SSM command completion..."
          TIMEOUT=300
          ELAPSED=0
          POLL_INTERVAL=5
          
          while [ $ELAPSED -lt $TIMEOUT ]; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "${{ env.SSM_COMMAND_ID }}" \
              --instance-id "${{ env.INSTANCE_ID }}" \
              --region ap-south-1 \
              --query 'Status' \
              --output text 2>/dev/null || echo "Unknown")
            
            echo "SSM Command Status: $STATUS (elapsed: ${ELAPSED}s)"
            
            if [ "$STATUS" = "Success" ]; then
              echo "✓ SSM command completed successfully"
              aws ssm get-command-invocation \
                --command-id "${{ env.SSM_COMMAND_ID }}" \
                --instance-id "${{ env.INSTANCE_ID }}" \
                --region ap-south-1 \
                --query 'StandardOutputContent' \
                --output text | tail -20
              exit 0
            fi
            
            if [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ]; then
              echo "✗ SSM command failed with status: $STATUS"
              echo "--- Standard Output ---"
              aws ssm get-command-invocation \
                --command-id "${{ env.SSM_COMMAND_ID }}" \
                --instance-id "${{ env.INSTANCE_ID }}" \
                --region ap-south-1 \
                --query 'StandardOutputContent' \
                --output text || true
              echo "--- Standard Error ---"
              aws ssm get-command-invocation \
                --command-id "${{ env.SSM_COMMAND_ID }}" \
                --instance-id "${{ env.INSTANCE_ID }}" \
                --region ap-south-1 \
                --query 'StandardErrorContent' \
                --output text || true
              exit 1
            fi
            
            sleep $POLL_INTERVAL
            ELAPSED=$((ELAPSED + POLL_INTERVAL))
          done
          
          echo "✗ SSM command polling timeout after ${TIMEOUT}s"
          exit 1

      - name: Wait for API readiness (multi-method health check)
        run: |
          echo "Waiting for API to be ready..."
          
          # Get the instance IP for direct testing
          INSTANCE_IP=$(aws ec2 describe-instances \
            --instance-ids "${{ env.INSTANCE_ID }}" \
            --region ap-south-1 \
            --query 'Reservations[0].Instances[0].PublicIpAddress' \
            --output text)
          echo "Instance IP: $INSTANCE_IP"
          
          # Method 1: Direct IP health check (HTTP, no SSL cert issues)
          echo "Attempting direct health check via instance IP..."
          for i in $(seq 1 5); do
            echo "Attempt $i/5..."
            if curl -fsS --max-time 5 --connect-timeout 3 "http://${INSTANCE_IP}/api/v1/health/ready" >/dev/null 2>&1; then
              echo "✓ API is ready"
              exit 0
            fi
            sleep 15
          done
          
          # Method 2: Check via domain with relaxed SSL
          echo "Attempting health check via domain (relaxed SSL)..."
          for i in $(seq 1 5); do
            echo "Attempt $i/5..."
            if curl -fsS -k --max-time 5 --connect-timeout 3 "https://api.autopilots.monster/api/v1/health/ready" >/dev/null 2>&1; then
              echo "✓ API is ready"
              exit 0
            fi
            sleep 15
          done
          
          # Method 3: Check docker container status via SSM
          echo "Checking docker container status..."
          if CONTAINER_STATUS=$(aws ssm send-command \
            --instance-ids "${{ env.INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=['cd /home/ubuntu/app && docker compose -f docker-compose.prod.yml ps -a && docker compose -f docker-compose.prod.yml logs --tail=100 api qdrant nginx']" \
            --region ap-south-1 \
            --query 'Command.CommandId' \
            --output text); then
            sleep 5
            aws ssm get-command-invocation \
              --command-id "$CONTAINER_STATUS" \
              --instance-id "${{ env.INSTANCE_ID }}" \
              --region ap-south-1 \
              --query 'StandardOutputContent' \
              --output text || true
          fi
          
          echo "✗ API readiness check failed"
          echo "Instance: $INSTANCE_IP"
          echo "This may indicate:"
          echo "  - Docker containers failed to start (check SSM logs)"
          echo "  - API port not exposed correctly"
          echo "  - Database/Redis not initialized"
          echo "  - SSL certificate generation failed"
          exit 1
