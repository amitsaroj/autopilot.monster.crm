name: Auto Deploy to EC2

on:
  push:
    branches: [ main ]

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Validate deploy contract files
        run: |
          test -f backend/.env.production
          test -f docker-compose.prod.yml
          test -f nginx/nginx.conf
          required_keys=(
            APP_PORT APP_HOST APP_URL NODE_ENV FRONTEND_URL
            JWT_ALGORITHM JWT_PRIVATE_KEY JWT_PUBLIC_KEY JWT_KEY_ID
            STRIPE_SECRET_KEY STRIPE_WEBHOOK_SECRET
          )
          for key in "${required_keys[@]}"; do
            if ! grep -q "^${key}=" backend/.env.production; then
              echo "Missing required key in backend/.env.production: ${key}"
              exit 1
            fi
          done

      - name: AWS Login
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      # --- GHCR LOGIN ---
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --- AUTOMATIC S3 BUCKET CREATION ---
      - name: Bootstrap S3 Bucket
        run: |
          BUCKET_NAME="autopilot-monster-state-${{ github.repository_owner }}"
          if ! aws s3api head-bucket --bucket "$BUCKET_NAME" 2>/dev/null; then
            echo "Bucket does not exist. Creating..."
            aws s3api create-bucket --bucket "$BUCKET_NAME" --region ap-south-1 --create-bucket-configuration LocationConstraint=ap-south-1
            aws s3api put-bucket-versioning --bucket "$BUCKET_NAME" --versioning-configuration Status=Enabled
          else
            echo "Bucket already exists."
          fi
          echo "BUCKET_NAME=$BUCKET_NAME" >> $GITHUB_ENV

      # --- TERRAFORM INIT WITH DYNAMIC BACKEND ---
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"
          terraform_wrapper: false

      - name: Terraform Init & Apply
        run: |
          export TF_IN_AUTOMATION=true
          terraform init \
            -backend-config="bucket=${{ env.BUCKET_NAME }}" \
            -backend-config="key=terraform.tfstate" \
            -backend-config="region=ap-south-1"
          terraform fmt -check -recursive
          terraform validate
          set +e
          terraform plan -out=tfplan -detailed-exitcode
          TF_PLAN_EXIT=$?
          set -e
          if [ "$TF_PLAN_EXIT" -eq 1 ]; then
            echo "Terraform plan failed"
            exit 1
          fi
          if [ "$TF_PLAN_EXIT" -eq 2 ]; then
            terraform apply -auto-approve tfplan
          else
            echo "No Terraform changes detected; skipping apply"
          fi
          echo "INSTANCE_ID=$(terraform output -raw instance_id)" >> $GITHUB_ENV
          echo "ELASTIC_IP=$(terraform output -raw elastic_ip)" >> $GITHUB_ENV

      # --- BUILD & PUSH DOCKER IMAGES (API + UI) ---
      - name: Build and Push API Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ghcr.io/${{ github.repository }}/api:latest

      # --- UPLOAD CONFIG FILES TO S3 ---
      - name: Sync Config to S3
        run: |
          aws s3 cp docker-compose.prod.yml s3://${{ env.BUCKET_NAME }}/deploy/docker-compose.prod.yml
          aws s3 cp nginx/nginx.conf s3://${{ env.BUCKET_NAME }}/deploy/nginx/nginx.conf
          if [ -f backend/.env.production ]; then
            aws s3 cp backend/.env.production s3://${{ env.BUCKET_NAME }}/deploy/backend/.env.production
          else
            echo "backend/.env.production not in repo — expecting file at s3://${{ env.BUCKET_NAME }}/deploy/backend/.env.production"
          fi

      # --- DEPLOY VIA SSM ---
      - name: Deploy via SSM
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ env.INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[
              \"sudo mkdir -p /home/ubuntu/app/nginx/ssl /home/ubuntu/app/backend /home/ubuntu/app/certbot/conf /home/ubuntu/app/certbot/www\",
              \"sudo chown -R ubuntu:ubuntu /home/ubuntu/app\",
              \"aws s3 cp s3://${{ env.BUCKET_NAME }}/deploy/docker-compose.prod.yml /home/ubuntu/app/docker-compose.prod.yml\",
              \"aws s3 cp s3://${{ env.BUCKET_NAME }}/deploy/nginx/nginx.conf /home/ubuntu/app/nginx/nginx.conf\",
              \"aws s3 cp s3://${{ env.BUCKET_NAME }}/deploy/backend/.env.production /home/ubuntu/app/backend/.env.production\",
              \"cd /home/ubuntu/app\",
              \"printf 'GITHUB_REPOSITORY=%s\\nDOMAIN=%s\\nNEXT_PUBLIC_API_URL=%s\\n' '${REPO_LOWER}' 'api.autopilots.monster' 'https://api.autopilots.monster/api/v1' > .env\",
              \"sudo docker login ghcr.io -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }}\",
              \"sudo docker compose -f docker-compose.prod.yml pull\",
              \"sudo docker compose -f docker-compose.prod.yml run --rm api npm run migrate:prod\",
              \"sudo docker compose -f docker-compose.prod.yml up -d --remove-orphans --force-recreate\",
              \"echo 'Deployment complete. Services running:'\",
              \"sudo docker compose -f docker-compose.prod.yml ps\"
            ]" \
            --region ap-south-1 \
            --query 'Command.CommandId' \
            --output text)
          echo "SSM_COMMAND_ID=$COMMAND_ID" >> $GITHUB_ENV

      - name: Wait for SSM completion
        run: |
          aws ssm wait command-executed \
            --command-id "${{ env.SSM_COMMAND_ID }}" \
            --instance-id "${{ env.INSTANCE_ID }}" \
            --region ap-south-1
          STATUS=$(aws ssm get-command-invocation \
            --command-id "${{ env.SSM_COMMAND_ID }}" \
            --instance-id "${{ env.INSTANCE_ID }}" \
            --region ap-south-1 \
            --query 'Status' \
            --output text)
          echo "SSM status: ${STATUS}"
          if [ "${STATUS}" != "Success" ]; then
            aws ssm get-command-invocation \
              --command-id "${{ env.SSM_COMMAND_ID }}" \
              --instance-id "${{ env.INSTANCE_ID }}" \
              --region ap-south-1 \
              --query 'StandardErrorContent' \
              --output text
            exit 1
          fi

      - name: Wait for API readiness
        run: |
          for i in $(seq 1 40); do
            if curl -fsS --max-time 5 "https://api.autopilots.monster/api/v1/health/ready" >/dev/null; then
              echo "API readiness check passed"
              exit 0
            fi
            sleep 10
          done
          echo "API readiness did not pass in time"
          exit 1
